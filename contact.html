<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代工與經銷洽詢 ｜ 聯絡我們</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        celadon:   '#7da198',
                        celadonL:  '#a8c5be',
                        mist:      '#4a6b6c',
                        mistDark:  '#2e4647',
                        goldPoint: '#d4a32b',
                        cream:     '#fcfbfa',
                        creamD:    '#f0eeeb',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', '"Noto Serif TC"', 'Georgia', 'serif'],
                        sans:  ['Inter', '"Noto Serif TC"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .tracking-ultra { letter-spacing: 0.28em; }
        #mobile-menu { transition: max-height 0.38s ease, opacity 0.28s ease; max-height: 0; opacity: 0; overflow: hidden; }
        #mobile-menu.open { max-height: 480px; opacity: 1; }
    </style>
</head>
<body class="bg-cream text-gray-800 font-sans antialiased overflow-x-hidden">

    <!-- Navbar (完整 5 分頁串聯) -->
    <nav class="fixed w-full bg-cream/90 backdrop-blur-xl z-50 border-b border-gray-100/70">
        <div class="max-w-7xl mx-auto px-6 md:px-10 h-[76px] flex justify-between items-center">
            <a href="index.html" class="flex flex-col items-center group">
                <span class="text-lg md:text-xl font-serif font-light tracking-ultra text-mist group-hover:text-celadon transition-colors duration-300">ÉRIN</span>
            </a>

            <!-- Desktop Nav -->
            <div class="hidden md:flex items-center space-x-8 text-[10.5px] uppercase tracking-widest text-gray-600 font-medium">
                <a href="index.html" class="hover:text-celadon transition-colors">首頁</a>
                <a href="brand.html" class="hover:text-celadon transition-colors">品牌故事</a>
                <a href="oem-odm.html" class="hover:text-celadon transition-colors">研發製造</a>
                <a href="blog.html" class="hover:text-celadon transition-colors">品牌誌</a>
                <a href="contact.html" class="text-celadon font-semibold">聯絡我們</a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="menu-btn" aria-label="Open menu" class="md:hidden flex flex-col justify-center items-center w-10 h-10 space-y-1.5 focus:outline-none">
                <span class="w-6 h-px bg-mist transition-transform duration-300" id="bar1"></span>
                <span class="w-6 h-px bg-mist transition-opacity duration-300" id="bar2"></span>
                <span class="w-6 h-px bg-mist transition-transform duration-300" id="bar3"></span>
            </button>
        </div>

        <!-- Mobile Dropdown -->
        <div id="mobile-menu" class="md:hidden bg-cream/98 border-b border-gray-200/80 px-6 py-6 space-y-4 text-xs uppercase tracking-widest">
            <a href="index.html" class="block py-2 text-gray-700 hover:text-celadon mobile-link">首頁</a>
            <a href="brand.html" class="block py-2 text-gray-700 hover:text-celadon mobile-link">品牌故事</a>
            <a href="oem-odm.html" class="block py-2 text-gray-700 hover:text-celadon mobile-link">研發製造</a>
            <a href="blog.html" class="block py-2 text-gray-700 hover:text-celadon mobile-link">品牌誌</a>
            <a href="contact.html" class="block py-2 text-celadon font-medium mobile-link">聯絡我們</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-36 pb-24 px-6 md:px-10 max-w-4xl mx-auto space-y-12">
        <div class="text-center space-y-4">
            <span class="text-xs uppercase tracking-widest text-celadon font-medium">Contact Us</span>
            <h1 class="text-3xl md:text-4xl font-serif text-mistDark">代理、經銷與業務洽詢</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest">請填寫下方表單，或透過下方資訊與我們聯繫</p>
        </div>

        <!-- Contact Info Cards -->
        <div class="grid md:grid-cols-3 gap-6">
            <div class="bg-white p-6 border border-celadon/20 shadow-sm text-center space-y-2">
                <span class="text-[10px] uppercase tracking-widest text-celadon font-semibold block">Address / 地址</span>
                <p class="text-xs text-gray-600 font-light leading-relaxed">宜蘭縣宜蘭市宜科南路15號2樓之1</p>
            </div>
            <div class="bg-white p-6 border border-celadon/20 shadow-sm text-center space-y-2">
                <span class="text-[10px] uppercase tracking-widest text-celadon font-semibold block">Phone / 電話</span>
                <p class="text-xs text-gray-600 font-light leading-relaxed">+886 972-122-513</p>
            </div>
            <div class="bg-white p-6 border border-celadon/20 shadow-sm text-center space-y-2">
                <span class="text-[10px] uppercase tracking-widest text-celadon font-semibold block">Email / 信箱</span>
                <p class="text-xs text-gray-600 font-light leading-relaxed">service@erinbio.com.tw</p>
            </div>
        </div>

        <!-- Google Form Embed Container -->
        <div class="bg-white p-4 md:p-8 border border-celadon/20 shadow-sm flex justify-center">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdK3k09h_yvOCEVFBiRRtKOjjvebakSEU9955jXdKawjjf3bA/viewform?embedded=true" width="100%" height="1545" frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-creamD border-t border-gray-200 py-12 px-6 text-center text-[10px] text-gray-400 tracking-wider">
        <p>&copy; 2026 Aileen Agritech Bio Co., Ltd. (艾琳智農生技股份有限公司) All Rights Reserved.</p>
    </footer>

    <!-- JavaScript for Mobile Menu -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const bar3 = document.getElementById('bar3');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('open');
            const isOpen = mobileMenu.classList.contains('open');
            bar1.style.transform = isOpen ? 'rotate(45deg) translate(5px, 5px)' : 'none';
            bar2.style.opacity = isOpen ? '0' : '1';
            bar3.style.transform = isOpen ? 'rotate(-45deg) translate(5px, -5px)' : 'none';
        });

        document.querySelectorAll('.mobile-link').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.remove('open');
                bar1.style.transform = 'none';
                bar2.style.opacity = '1';
                bar3.style.transform = 'none';
            });
        });
    </script>
</body>
</html>
